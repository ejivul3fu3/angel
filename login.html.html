<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>小天使登入系統</title>
<style>
  :root{
    --bg1:#F3F4F0; --bg2:#EDEFEA; --bg3:#E8ECEB;
    --card:#FFFFFF;
    --ink:#2E3532; --ink-soft:#6E7873;
    --line:#E1E5E0;
    --sage:#5C7A70; --sage-deep:#3E564D; --sage-pale:#E6EEEA;
    --amber:#B8935A; --amber-deep:#8A6836; --amber-pale:#F2EBDD;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 45%,var(--bg3) 100%);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;
    color:var(--ink);
    min-height:100vh;
  }
  .wrap{ max-width:760px; margin:0 auto; padding:20px 16px 60px; }
  h1,h2,h3{ margin:0; }
  button{ font-family:inherit; }
  .card{
    background:rgba(255,253,248,0.92); backdrop-filter:blur(12px);
    border-radius:26px; border:1px solid rgba(255,255,255,0.7);
    box-shadow:0 8px 26px rgba(60,80,70,0.1);
  }

  /* ---------- 登入畫面 ---------- */
  #loginScreen{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .login-card{ padding:32px 28px 28px; width:min(94vw,420px); text-align:center; }
  .login-card h1{ font-size:24px;margin-bottom:4px;color:var(--sage-deep);font-weight:800; }
  .login-stars{ font-size:14px; letter-spacing:6px; color:var(--amber); margin-bottom:6px; }
  .login-card .sub{ font-size:13px;color:var(--ink-soft);margin-bottom:20px;line-height:1.6; }
  input[type=text], input[type=password]{
    width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);
    font-size:15px;text-align:center;margin-bottom:12px;outline:none;background:#fff;
  }
  input:focus{ border-color:var(--sage); }
  .primary-btn{
    width:100%;padding:13px;border-radius:999px;border:none;
    background:linear-gradient(135deg,#5C7A70,#3E564D);color:#fff;font-size:15px;font-weight:700;cursor:pointer;
    box-shadow:0 6px 16px rgba(62,86,77,0.3);
  }
  .primary-btn:disabled{ background:#E5DDD0;cursor:not-allowed; box-shadow:none; }
  .err-msg{ font-size:12.5px;color:#C0435C;margin:-4px 0 12px;min-height:16px; }
  .hint-msg{ font-size:11.5px;color:var(--ink-soft);margin:10px 0 0; line-height:1.6; }
  .suggest-box{
    position:absolute; left:0; right:0; top:calc(100% - 8px); z-index:20;
    background:#fff; border-radius:14px; box-shadow:0 10px 28px rgba(60,80,70,0.16);
    border:1px solid var(--line); max-height:220px; overflow-y:auto;
    display:none; text-align:left;
  }
  .suggest-box.show{ display:block; }
  .suggest-group-label{
    font-size:10.5px; font-weight:700; color:var(--sage-deep); background:var(--sage-pale);
    padding:5px 14px;
  }
  .suggest-item{
    padding:10px 14px; font-size:14px; color:var(--ink); cursor:pointer;
    border-top:1px solid var(--line);
  }
  .suggest-item:hover, .suggest-item.active{ background:var(--sage-pale); }

  /* ---------- 主畫面 ---------- */
  #dashScreen{ display:none; }
  .app-brand{ font-size:13px; font-weight:800; color:var(--ink-soft); letter-spacing:1px; margin-bottom:6px; }
  .welcome-sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .top-bar{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;
  }
  .top-bar .who{ font-size:19px; font-weight:800; color:var(--sage-deep); }
  .top-bar .role-badge{
    font-size:11.5px; font-weight:700; padding:4px 12px; border-radius:999px;
    background:var(--amber-pale); color:var(--amber-deep); margin-left:8px;
  }
  .logout-btn{
    border:none; background:var(--card); color:var(--ink-soft); font-size:12.5px;
    padding:8px 14px; border-radius:999px; cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,0.06);
  }

  .panel{ padding:18px 20px; margin-bottom:14px; }
  .panel-title{ font-size:15px; font-weight:800; color:var(--sage-deep); margin-bottom:4px; }
  .panel-sub{ font-size:12px; color:var(--ink-soft); margin-bottom:12px; }

  .member-card{
    background:#FBFAF6; border-radius:14px; padding:12px 16px; margin-bottom:8px;
  }
  .team-member-card{
    background:#fff; border-radius:18px; padding:16px 18px; margin-bottom:16px;
    border-left:6px solid var(--sage); box-shadow:0 4px 16px rgba(60,80,70,0.1);
  }
  .team-member-card .mc-name{ font-size:17px; }
  .team-member-card .cat-block{
    background:#FBFAF6; border-radius:12px; padding:10px 12px; margin-top:8px;
  }
  .team-member-card .cat-label{ font-size:11px; font-weight:800; margin-bottom:6px; display:flex; align-items:center; gap:4px; }
  .member-card .mc-head{
    display:flex; justify-content:space-between; align-items:center; cursor:pointer;
  }
  .member-card .mc-name{ font-weight:700; color:var(--sage-deep); font-size:15px; }
  .member-card .mc-badge{
    font-size:11px; font-weight:700; background:var(--sage-pale); color:var(--sage-deep);
    padding:2px 10px; border-radius:999px;
  }
  .member-card .mc-body{ display:none; margin-top:10px; font-size:12.5px; color:var(--ink); line-height:1.8; }
  .member-card .mc-body table{ width:100%; border-collapse:collapse; margin-top:6px; }
  .member-card .mc-body td{ padding:5px 6px; border-top:1px solid var(--line); font-size:13px; }
  .chev{ color:var(--ink-soft); transition:transform .15s ease; }
  .member-card.open .chev{ transform:rotate(90deg); }
  .member-card.open .mc-body{ display:block; }

  .self-stat-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .self-stat{
    flex:1; min-width:110px; background:#FBFAF6; border-radius:14px; padding:12px; text-align:center;
  }
  .self-stat .ss-num{ font-size:22px; font-weight:900; color:var(--sage-deep); }
  .self-stat .ss-label{ font-size:11px; color:var(--ink-soft); }

  .empty-note{ color:var(--ink-soft); font-size:13px; text-align:center; padding:20px 0; }
  .tab-switch{
    display:flex; gap:8px; margin-bottom:14px; background:rgba(255,255,255,0.7);
    border-radius:14px; padding:5px; box-shadow:0 3px 10px rgba(60,80,70,0.08);
  }
  .tab-switch-btn{
    flex:1; padding:11px 8px; border-radius:11px; border:none; background:none;
    font-size:13.5px; font-weight:700; color:var(--ink-soft); cursor:pointer;
    transition:all .2s ease;
  }
  .tab-switch-btn.active{ background:var(--sage); color:#fff; box-shadow:0 3px 10px rgba(52,90,76,0.25); }
  .hint-note{ font-size:11.5px; color:var(--ink-soft); background:#F0EEE7; border-radius:10px; padding:8px 12px; margin-top:10px; line-height:1.6; }

  /* ---------- 搭檔感情狀態 ---------- */
  .partner-card{ background:linear-gradient(135deg,var(--amber-pale) 0%,#fff 60%); }
  .partner-row{
    display:flex; align-items:center; justify-content:center; gap:18px; margin:10px 0 16px;
  }
  .partner-avatar-wrap{ text-align:center; }
  .partner-avatar{
    border-radius:50%; background:var(--sage-pale);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 4px; transition:all .4s ease;
    animation:partnerBob 2.6s ease-in-out infinite;
  }
  @keyframes partnerBob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-5px); } }
  .partner-name{ font-size:11.5px; font-weight:700; color:var(--sage-deep); max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .partner-heart{ font-size:26px; animation:heartPulse 1.4s ease-in-out infinite; }
  @keyframes heartPulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.25); } }
  .stage-box{ background:rgba(255,255,255,0.7); border-radius:14px; padding:12px 14px; }
  .stage-title{ font-size:16px; font-weight:800; color:var(--amber-deep); margin-bottom:2px; }
  .stage-desc{ font-size:12px; color:var(--ink-soft); margin-bottom:8px; }
  .stage-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:6px; }
  .progress-outer{ background:var(--sage-pale); border-radius:999px; height:10px; overflow:hidden; }
  .progress-inner{ height:100%; background:linear-gradient(90deg,var(--amber),#D4B87E); border-radius:999px; transition:width .5s ease; }

  .arrival-row{
    background:#FBFAF6; border-radius:16px; padding:16px 18px; margin-bottom:16px;
    border-left:6px solid var(--line); box-shadow:0 3px 12px rgba(60,80,70,0.06);
    transition:background .3s ease, box-shadow .3s ease;
  }
  .arrival-row.both-arrived{
    background:linear-gradient(135deg,#FFF3D6,#FBE7F5);
    box-shadow:0 0 0 2px var(--amber);
  }
  .arrival-date-badge{
    display:inline-block; font-size:12.5px; font-weight:700; color:#fff;
    padding:4px 12px; border-radius:999px; margin-bottom:8px;
  }
  .arrival-headline{ font-size:19px; font-weight:900; color:var(--ink); margin-bottom:4px; line-height:1.3; }
  .arrival-label{ font-size:14px; font-weight:700; color:var(--ink); margin-bottom:8px; }
  .arrival-btns{ display:flex; gap:8px; flex-wrap:wrap; }
  .mini-toggle{
    flex:1; min-width:120px; padding:9px 10px; border-radius:10px; border:1.5px solid var(--line);
    background:#fff; color:var(--ink-soft); font-size:13px; font-weight:600; cursor:pointer;
  }
  .mini-toggle.on{ background:var(--sage); border-color:var(--sage); color:#fff; }
  .mini-toggle.on-absent{ background:#C0435C; border-color:#C0435C; color:#fff; }
  .reason-note{ font-size:11px; color:#C0435C; background:#FCE9EC; border-radius:8px; padding:6px 10px; margin-top:6px; }
  .score-note-block{
    margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);
  }
  .score-note-label{ font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:8px; }
  .inline-score-value{ font-size:14px; font-weight:800; color:var(--sage-deep); min-width:40px; text-align:right; }
  .score-note-input{
    width:100%; min-height:56px; border-radius:10px; border:1.5px solid var(--line);
    padding:8px 10px; font-size:12.5px; font-family:inherit; resize:vertical; outline:none;
  }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(43,58,52,0.4);
    display:none; align-items:center; justify-content:center; z-index:60; padding:20px;
  }
  .modal{ background:var(--card); border-radius:20px; padding:22px; width:min(92vw,380px); }
  .modal h3{ margin:0 0 4px;font-size:17px;color:var(--sage-deep); }
  .modal .modal-sub{ font-size:12.5px;color:var(--ink-soft);margin-bottom:14px; }
  .modal-close{
    width:100%; padding:10px; border-radius:10px; border:none;
    background:#F0EEE7; color:var(--ink-soft); font-size:13px; cursor:pointer;
  }
</style>
</head>
<body>

<!-- ============ 登入 / 註冊畫面 ============ -->
<div id="loginScreen">
  <div class="card login-card">
    <div class="login-stars">✦ ⋆ ✧ ⋆ ✦</div>
    <h1>👼 小天使登入系統</h1>
    <div class="sub">輸入你的名字和密碼。第一次輸入會自動幫你建立帳號，之後要用同一組密碼登入。</div>
    <div style="position:relative;">
      <input type="text" id="nameInput" placeholder="你的名字（跟名單上一致）" autocomplete="off">
      <div id="nameSuggestBox" class="suggest-box"></div>
    </div>
    <input type="password" id="pwInput" placeholder="設定或輸入你的密碼">
    <div class="err-msg" id="loginErr"></div>
    <button class="primary-btn" id="enterBtn">登入 / 註冊</button>
    <div style="text-align:center;margin-top:10px;">
      <span id="forgotPwLink" style="font-size:12px;color:var(--ink-soft);text-decoration:underline;cursor:pointer;">忘記密碼？點此重設</span>
    </div>
    <div class="hint-msg">大天使請直接輸入你的大天使名字（例如：特特、小珠、韋萱、Yoyo、Linda、鎮宏），登入後會看到專屬的管理畫面。</div>
    <div class="hint-msg" id="connStatus" style="font-weight:700;"></div>
  </div>
</div>

<!-- ============ 主畫面 ============ -->
<div id="dashScreen">
  <div class="wrap">
    <div class="app-brand">👼 小天使打卡</div>
    <div class="top-bar">
      <div>
        <div><span class="who" id="whoName">－</span><span class="role-badge" id="roleBadge">小天使</span></div>
        <div class="welcome-sub" id="welcomeSub"></div>
      </div>
      <button class="logout-btn" id="logoutBtn">登出</button>
    </div>
    <div id="dashContent"></div>
  </div>
</div>

<!-- ============ 自訂輸入視窗（取代瀏覽器原生 prompt/confirm，避免被 App 內建瀏覽器擋掉） ============ -->
<div class="modal-overlay" id="customPromptOverlay">
  <div class="modal">
    <h3 id="customPromptTitle">標題</h3>
    <div class="modal-sub" id="customPromptSub" style="display:none;"></div>
    <input type="text" id="customPromptInput" style="width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);font-size:15px;margin-bottom:14px;outline:none;">
    <div id="customRatingBlock" style="display:none;margin-bottom:14px;text-align:center;">
      <div id="ratingEmoji" style="font-size:40px;margin-bottom:6px;">😐</div>
      <div id="ratingValue" style="font-size:26px;font-weight:900;color:var(--sage-deep);margin-bottom:10px;">5 分</div>
      <input type="range" id="ratingSlider" min="1" max="10" value="5" style="width:100%;accent-color:var(--sage);">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-top:4px;">
        <span>1 低</span><span>10 高</span>
      </div>
    </div>
    <button class="primary-btn" id="customPromptOk" style="margin-bottom:8px;">確定</button>
    <button class="modal-close" id="customPromptCancel">取消</button>
  </div>
</div>

function decodeNode(raw){
  const decoded = {};
  Object.keys(raw||{}).forEach(taskKey=>{
    decoded[taskKey] = {};
    Object.keys(raw[taskKey]||{}).forEach(safeName=>{
      decoded[taskKey][decodeURIComponent(safeName)] = raw[taskKey][safeName];
    });
  });
  return decoded;
}
function decodeFlat(raw){
  const decoded = {};
  Object.keys(raw||{}).forEach(safeName=>{ decoded[decodeURIComponent(safeName)] = raw[safeName]; });
  return decoded;
}

// 夢幻連動判定：小夥伴（新生）跟小天使一起到場，或是只有小天使到場但當週跟搭檔也互相通話分享
function dreamyLinkForEvent(name, eventKey){
  const meArrived = isEventChecked(name, eventKey);
  if(!meArrived) return false;
  const buddyArrived = isEventBuddyArrived(name, eventKey);
  if(buddyArrived) return true;
  const mate = teammateOf(name);
  if(!mate) return false;
  const evWeekKey = weekKeyForDate(EVENT_DATES[eventKey]);
  const wk = allWeeksCalls[evWeekKey] || {};
  const callThatWeek = wk.call || {};
  return !!(callThatWeek[name] && callThatWeek[mate]);
}

function pairCallXP(name, mate){
  if(!mate) return 0;
  let xp = 0;
  // 每週通話：兩人都做 +20，只有一人做 +10
  Object.keys(allWeeksCalls).forEach(wk=>{
    PARTNER_WEEKLY_TASKS.forEach(t=>{
      const c = allWeeksCalls[wk] && allWeeksCalls[wk][t.key];
      if(!c) return;
      const meDid = !!c[name], mateDid = !!c[mate];
      if(meDid && mateDid) xp += 20;
      else if(meDid || mateDid) xp += 10;
    });
  });
  // 每月關懷員約覆盤：誰做了都各自 +10
  Object.keys(allMonthsReview).forEach(mk=>{
    const r = allMonthsReview[mk] || {};
    if(r[name]) xp += 10;
    if(r[mate]) xp += 10;
  });
  // 每月圓夢支持：兩人都做 +20，只有一人做 +10
  Object.keys(allMonthsDream).forEach(mk=>{
    const r = allMonthsDream[mk] || {};
    const meDid = !!r[name], mateDid = !!r[mate];
    if(meDid && mateDid) xp += 20;
    else if(meDid || mateDid) xp += 10;
  });
  // 課後課／同學會場次：自己或搭檔有出席都各自 +10，同時／通話連動再加碼 +15
  EVENTS.forEach(ev=>{
    if(isEventChecked(name, ev.key)) xp += 10;
    if(isEventChecked(mate, ev.key)) xp += 10;
    if(ev.buddyRequired && (dreamyLinkForEvent(name, ev.key) || dreamyLinkForEvent(mate, ev.key))){
      xp += 15;
    }
  });
  return xp;
}
function stageFor(xp, stageSet){
  const set = stageSet || RELATIONSHIP_STAGES;
  let cur = set[0];
  set.forEach(s=>{ if(xp>=s.min) cur=s; });
  return cur;
}
function nextStageFor(xp, stageSet){
  const set = stageSet || RELATIONSHIP_STAGES;
  return set.find(s=>s.min>xp) || null;
}
function refreshCurrentDash(){
  if(!myName) return;
  const content = document.getElementById("dashContent");
  if(LEADER_NAMES.includes(myName)) renderLeaderDash(myName, content);
  else if(groupOf[myName]) renderMemberDash(myName, content);
}

// ---------- 自訂輸入視窗（取代 window.prompt / window.confirm，避免被 App 內建瀏覽器擋掉） ----------
function customPrompt(title, defaultVal){
  return new Promise(resolve=>{
    const overlay = document.getElementById("customPromptOverlay");
    const titleEl = document.getElementById("customPromptTitle");
    const subEl = document.getElementById("customPromptSub");
    const input = document.getElementById("customPromptInput");
    const okBtn = document.getElementById("customPromptOk");
    const cancelBtn = document.getElementById("customPromptCancel");

    titleEl.textContent = title;
    subEl.style.display = "none";
    input.style.display = "block";
    input.value = defaultVal || "";
    document.getElementById("customRatingBlock").style.display = "none";
    overlay.style.display = "flex";
    setTimeout(()=>input.focus(), 50);

    function cleanup(result){
      overlay.style.display = "none";
      okBtn.onclick = null; cancelBtn.onclick = null; input.onkeydown = null;
      resolve(result);
    }
    okBtn.onclick = ()=> cleanup(input.value);
    cancelBtn.onclick = ()=> cleanup(null);
    input.onkeydown = e=>{ if(e.key==="Enter") cleanup(input.value); };
  });
}
function customConfirm(msg){
  return new Promise(resolve=>{
    const overlay = document.getElementById("customPromptOverlay");
    const titleEl = document.getElementById("customPromptTitle");
    const subEl = document.getElementById("customPromptSub");
    const input = document.getElementById("customPromptInput");
    const okBtn = document.getElementById("customPromptOk");
    const cancelBtn = document.getElementById("customPromptCancel");

    titleEl.textContent = "請確認";
    subEl.textContent = msg;
    subEl.style.display = "block";
    input.style.display = "none";
    document.getElementById("customRatingBlock").style.display = "none";
    overlay.style.display = "flex";

    function cleanup(result){
      overlay.style.display = "none";
      okBtn.onclick = null; cancelBtn.onclick = null;
      resolve(result);
    }
    okBtn.onclick = ()=> cleanup(true);
    cancelBtn.onclick = ()=> cleanup(false);
  });
}
const RATING_EMOJI = ["😞","😞","😕","😕","😐","😐","🙂","🙂","😄","🤩"];

let toastTimer = null;
function showToast(msg){
  let t = document.getElementById("toastEl");
  if(!t){
    t = document.createElement("div");
    t.id = "toastEl";
    t.style.cssText = "position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#3E564D;color:#fff;padding:10px 20px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:60;opacity:0;transition:opacity .3s ease;pointer-events:none;white-space:nowrap;max-width:90vw;";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.style.opacity = "0"; }, 2800);
}
function dreamyBurst(){
  const emojis = ["🌈","✨","💫","🎉","👼","💕","⭐"];
  for(let i=0;i<18;i++){
    const p = document.createElement("div");
    p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    p.style.cssText = "position:fixed;left:50%;top:35%;font-size:"+(16+Math.random()*16)+"px;z-index:65;pointer-events:none;transition:transform 1.1s cubic-bezier(.2,.8,.3,1), opacity 1.1s ease;transform:translate(-50%,-50%);";
    document.body.appendChild(p);
    const angle = Math.random()*Math.PI*2, dist = 100+Math.random()*160;
    const dx = Math.cos(angle)*dist, dy = Math.sin(angle)*dist;
    requestAnimationFrame(()=>{
      p.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${Math.random()*360}deg)`;
      p.style.opacity = "0";
    });
    setTimeout(()=>p.remove(), 1200);
  }
}
function checkCelebrations(){
  EVENTS.filter(ev=>ev.buddyRequired).forEach(ev=>{
    Object.keys(byAngel).forEach(name=>{

      const linked = dreamyLinkForEvent(name, ev.key);

enterBtn.addEventListener("click", async ()=>{
  const name = nameInput.value.trim();
  const pw = pwInput.value;
  loginErr.textContent = "";
  if(!name || !pw){ loginErr.textContent = "請輸入名字和密碼"; return; }

  if(!fbEnabled){
    const localKey = "loginPw_"+name;

    if(savedLocalPw === null){
      localStorage.setItem(localKey, pw);

    }
    return;

  enterBtn.disabled = true;
  try{
    const ref = fbDb.ref(`accounts/${encodeURIComponent(name)}`);
    const snap = await ref.once("value");
    const saved = snap.val();
    if(saved === null){
      await ref.set(pw);
      myName = name;
      showDashboard();
    } else if(saved === pw){
      myName = name;
      showDashboard();
    } else {
      loginErr.textContent = "密碼不正確，請再確認一次";
    }
  }catch(e){

      evBtn.addEventListener("click", ()=> card.classList.add("open"));
    }
  });
  list.querySelectorAll("[data-helpcheckin]").forEach(btn=>{
    btn.addEventListener("click", async (e)=>{
      e.stopPropagation();
      const key = btn.dataset.helpcheckin;
      const helpName = btn.dataset.helpname;
      const ev = EVENTS.find(x=>x.key===key);
      const ok = await customConfirm(`確定「${helpName}」有到「${ev.type}${ev.topic?`「${ev.topic}」`:""}」（${ev.date}），幫他補打卡嗎？`);

      setEventStatus(helpName, key, "arrived", "");

  });
}

function wireSelfSectionEvents(name, idPrefix){
  const g = groupOf[name];
  const col = GROUP_COLORS[g];

  const tabSwitch = document.getElementById(`${idPrefix}TabSwitch`);
  if(tabSwitch){
    tabSwitch.querySelectorAll(".tab-switch-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        activeCareTab = btn.dataset.tabtarget;
        tabSwitch.querySelectorAll(".tab-switch-btn").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(`${idPrefix}TabCare`).style.display = activeCareTab==="care" ? "block" : "none";
        document.getElementById(`${idPrefix}TabStudent`).style.display = activeCareTab==="student" ? "block" : "none";
      });
    });
  }

  // 搭檔每週任務（每週通話 + 圓夢支持，都累積感情經驗值）
  const callBox = document.getElementById(`${idPrefix}CallToggle`);
  if(callBox){
    callBox.innerHTML = PARTNER_WEEKLY_TASKS.map(t=>{
      const done = isChecked(name, t.key);
      const time = callTimeData[name] || "";
      return `<div class="member-card" style="cursor:pointer;" data-calltoggle="${t.key}">
        <div class="mc-head" style="cursor:pointer;">
          <span class="mc-name">${t.emoji} ${t.label}</span>
          <span class="mc-badge" style="${done?`background:${col.bg};color:${col.text};`:""}">${done?"✓ 完成了！+10 顆愛心":"點一下打卡"}</span>
        </div>
        ${done && time ? `<div style="font-size:11px;color:var(--ink-soft);margin-top:6px;">🕐 通話時間：${time.replace(/</g,"&lt;")}</div>` : ""}
      </div>`;
    }).join("");
    callBox.querySelectorAll("[data-calltoggle]").forEach(el=>{
      el.addEventListener("click", async ()=>{
        const key = el.dataset.calltoggle;
        const cur = isChecked(name, key);
        if(!cur){
          const time = await customPrompt("請輸入通話時間（例如：8/20 20:30）：", "");
          if(time===null) return;
          setChecked(name, key, true);
          setCallTime(name, time);
          showToast("✨ 完成！愛心 +10（如果搭檔也做了，再加碼 +10）");
          const score = await customRating("藉事練心 🪞", "為自己這次在給出愛的用心程度，1-10分打一下分數與紀錄心得吧！");
          saveSelfScore(`village/selfScore/call/${weekKey}/${encodeURIComponent(name)}`, score);
        } else {
          setChecked(name, key, false);
        }
      });
    });
  }

  // 陪伴新生每週通話
  const studentCallBox = document.getElementById(`${idPrefix}StudentCallToggle`);
  if(studentCallBox){
    const t = STUDENT_WEEKLY_TASK;
    const done = isChecked(name, t.key);
    const time = studentCallTimeData[name] || "";

      <div class="mc-head" style="cursor:pointer;">

      ${done && time ? `<div style="font-size:11px;color:var(--ink-soft);margin-top:6px;">🕐 通話時間：${time.replace(/</g,"&lt;")}</div>` : ""}

      }

    const done = isDreamDone(name);
    dreamBox.innerHTML = `<div class="member-card" style="cursor:pointer;" data-dreamtoggle="1">
      <div class="mc-head" style="cursor:pointer;">
        <span class="mc-name">⭐ 這個月已完成圓夢支持</span>
        <span class="mc-badge" style="${done?`background:${col.bg};color:${col.text};`:""}">${done?"✓ 完成了！+10 顆愛心":"點一下打卡"}</span>
      </div>
      ${done && dreamTimeData[name] ? `<div style="font-size:11px;color:var(--ink-soft);margin-top:6px;">🕐 時間：${dreamTimeData[name].replace(/</g,"&lt;")}</div>` : ""}
    </div>`;
    dreamBox.querySelector("[data-dreamtoggle]").addEventListener("click", async ()=>{
      const cur = isDreamDone(name);
      if(!cur){
        const time = await customPrompt("請輸入圓夢支持的時間（例如：8/20 下午）：", "");
        if(time===null) return;
        setDreamDone(name, true);
        setDreamTime(name, time);
        showToast("⭐ 圓夢支持完成！愛心 +10（如果搭檔這個月也做了，再加碼 +10）");
        const score = await customRating("藉事練心 🪞", "為自己這次在給出愛的用心程度，1-10分打一下分數與紀錄心得吧！");
        saveSelfScore(`village/selfScore/dream/${monthKey}/${encodeURIComponent(name)}`, score);
      } else {
        setDreamDone(name, false);
      }

    monthlyBox.innerHTML = `<div class="member-card" style="cursor:pointer;" data-monthlytoggle="1">
      <div class="mc-head" style="cursor:pointer;">
        <span class="mc-name">🗓️ 這個月已約關懷員覆盤</span>
        <span class="mc-badge" style="${done?`background:${col.bg};color:${col.text};`:""}">${done?"✓ 約過了":"點一下打卡"}</span>
      </div>
      ${done && reviewTimeData[name] ? `<div style="font-size:11px;color:var(--ink-soft);margin-top:6px;">🕐 時間：${reviewTimeData[name].replace(/</g,"&lt;")}</div>` : ""}
    </div>`;
    monthlyBox.querySelector("[data-monthlytoggle]").addEventListener("click", async ()=>{
      const cur = isMonthlyDone(name);
      if(!cur){
        const time = await customPrompt("請輸入覆盤的時間（例如：8/20 下午）：", "");
        if(time===null) return;

        setReviewTime(name, time);
        showToast("🗓️ 太棒了，這個月的關懷員覆盤完成打卡！愛心 +10");
        const score = await customRating("藉事練心 🪞", "為自己這次在給出愛的用心程度，1-10分打一下分數與紀錄心得吧！");
        saveSelfScore(`village/selfScore/review/${monthKey}/${encodeURIComponent(name)}`, score);
      } else {
        setMonthlyDone(name, false);
      }
    });
  }

  // 場次打卡（自己 + 小夥伴，各自打卡，未能抵達可以填原因）
  const arrivalBox = document.getElementById(`${idPrefix}ArrivalToggles`);
  if(arrivalBox){
    arrivalBox.innerHTML = EVENTS.map(ev=>{
      const meArrived = isEventChecked(name, ev.key);
      const meAbsent = isEventAbsent(name, ev.key);
      const meReason = (eventStatusOf(name, ev.key)||{}).reason || "";
      const buddyArrived = isEventBuddyArrived(name, ev.key);
      const buddyAbsent = isEventBuddyAbsent(name, ev.key);
      const buddyReason = (buddyEventStatusOf(name, ev.key)||{}).reason || "";
      const linked = ev.buddyRequired ? dreamyLinkForEvent(name, ev.key) : false;
      const rowHighlight = ev.buddyRequired ? (linked?"both-arrived":"") : (meArrived?"both-arrived":"");
      const registered = isRegistered(name, ev.key);
      const regBlock = ev.formLink
        ? `<div style="margin-bottom:8px;">
            <a href="${ev.formLink}" target="_blank" rel="noopener" style="display:inline-block;font-size:12px;color:var(--sage-deep);font-weight:700;text-decoration:underline;margin-right:10px;">📝 前往報名表單</a>
            <button class="mini-toggle" style="min-width:90px;width:auto;display:inline-block;padding:5px 12px;${registered?"background:var(--sage);border-color:var(--sage);color:#fff;":""}" data-regtoggle="${ev.key}">${registered?"✅ 已報名":"點一下標記已報名"}</button>
          </div>`
        : ev.regNote
          ? `<div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;">📝 ${ev.regNote}${ev.regNote!=="報名連結尚未公布" ? `　<button class="mini-toggle" style="min-width:90px;width:auto;display:inline-block;padding:5px 12px;${registered?"background:var(--sage);border-color:var(--sage);color:#fff;":""}" data-regtoggle="${ev.key}">${registered?"✅ 已報名":"點一下標記已報名"}</button>` : ""}</div>`
          : "";
      return `
        <div class="arrival-row ${rowHighlight}" style="border-left-color:${EVENT_TYPE_COLOR[ev.type]||'var(--sage)'};">
          <div class="arrival-date-badge" style="background:${EVENT_TYPE_COLOR[ev.type]||'var(--sage)'};">🗓️ ${ev.date}　${ev.time}</div>
          <div class="arrival-headline">${ev.emoji} ${ev.type}${ev.topic?`「${ev.topic}」`:""}</div>
          ${linked ? `<div style="font-size:13px;font-weight:700;color:var(--amber-deep);margin-bottom:8px;">🌈 夢幻連動！</div>` : ""}
          ${ev.location ? `<div style="font-size:11px;color:var(--ink-soft);margin-bottom:8px;">📍 ${ev.location}</div>` : ""}
          ${regBlock}
          <div style="font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;">${ev.buddyRequired?"👼 我：":"我："}</div>
          <div class="arrival-btns">
            <button class="mini-toggle ${meArrived?"on":""}" data-evstatus="${ev.key}" data-who="me" data-status="arrived">✅ ${ev.buddyRequired?"我到了":"我出席了"}</button>
            <button class="mini-toggle ${meAbsent?"on-absent":""}" data-evstatus="${ev.key}" data-who="me" data-status="absent">❌ 我未能抵達</button>
          </div>
          ${meAbsent ? `<div class="reason-note">原因：${(meReason||"（未填寫）").replace(/</g,"&lt;")}</div>` : ""}
          ${ev.buddyRequired ? `
          <div style="font-size:11px;font-weight:700;color:var(--ink-soft);margin:8px 0 4px;">🎒 小夥伴：</div>
          <div class="arrival-btns">
            <button class="mini-toggle ${buddyArrived?"on":""}" data-evstatus="${ev.key}" data-who="buddy" data-status="arrived">✅ 小夥伴到了</button>
            <button class="mini-toggle ${buddyAbsent?"on-absent":""}" data-evstatus="${ev.key}" data-who="buddy" data-status="absent">❌ 小夥伴未能抵達</button>
          </div>
          ${buddyAbsent ? `<div class="reason-note">原因：${(buddyReason||"（未填寫）").replace(/</g,"&lt;")}</div>` : ""}
          ` : ""}
          ${(ev.buddyRequired && !linked && meArrived) ? `<div style="font-size:11px;color:var(--ink-soft);margin-top:6px;">💡 小提示：跟搭檔通個電話分享一下這場的收穫，也能觸發夢幻連動喔！</div>` : ""}
          <div class="score-note-block">
            <div class="score-note-label">🪞 藉事練心：為自己這次在給出愛的用心程度，1-10分打一下分數與紀錄心得吧！</div>
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
              <input type="range" min="1" max="10" value="${eventScoreData[ev.key]&&eventScoreData[ev.key][name] || 5}" class="inline-score-slider" data-scoreevent="${ev.key}" style="flex:1;accent-color:var(--sage);">
              <span class="inline-score-value" data-scorevalue="${ev.key}">${eventScoreData[ev.key]&&eventScoreData[ev.key][name] || 5} 分</span>
            </div>
            <textarea class="score-note-input" data-noteevent="${ev.key}" placeholder="留下這場的心得（選填）">${(eventNoteData[ev.key]&&eventNoteData[ev.key][name])||""}</textarea>
            <button class="mini-toggle" style="width:100%;margin-top:6px;" data-savenote="${ev.key}">💾 儲存分數與心得</button>
          </div>
        </div>
      `;
    }).join("");
    arrivalBox.querySelectorAll("[data-evstatus]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const key = btn.dataset.evstatus;
        const who = btn.dataset.who;
        const status = btn.dataset.status;
        if(status==="absent"){
          const alreadyAbsent = who==="me" ? isEventAbsent(name, key) : isEventBuddyAbsent(name, key);
          if(alreadyAbsent){
            if(who==="me") setEventStatus(name, key, null, "");
            else setBuddyEventStatus(name, key, null, "");
            return;
          }
          const reason = await customPrompt(who==="me" ? "請輸入你未能抵達的原因：" : "請輸入小夥伴未能抵達的原因：", "");
          if(reason===null) return;
          if(who==="me") setEventStatus(name, key, "absent", reason);
          else setBuddyEventStatus(name, key, "absent", reason);
        } else {
          const alreadyArrived = who==="me" ? isEventChecked(name, key) : isEventBuddyArrived(name, key);
          if(alreadyArrived){
            if(who==="me") setEventStatus(name, key, null, "");
            else setBuddyEventStatus(name, key, null, "");
            showToast("↩️ 已取消打卡，改回沒有按");
            return;
          }
          if(who==="me"){
            setEventStatus(name, key, "arrived", "");
            showToast("🎉 出席打卡完成！愛心 +10，記得在下面留個分數跟心得喔");
          } else {
            setBuddyEventStatus(name, key, "arrived", "");
          }
        }
      });
    });
    arrivalBox.querySelectorAll("[data-regtoggle]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const key = btn.dataset.regtoggle;
        const cur = isRegistered(name, key);
        setRegistered(name, key, !cur);
        if(!cur) showToast("📝 已標記為報名完成！");
      });
    });
    arrivalBox.querySelectorAll("[data-scoreevent]").forEach(slider=>{
      slider.addEventListener("input", ()=>{
        const key = slider.dataset.scoreevent;
        const valueEl = arrivalBox.querySelector(`[data-scorevalue="${key}"]`);
        if(valueEl) valueEl.textContent = `${slider.value} 分`;
      });
    });
    arrivalBox.querySelectorAll("[data-savenote]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const key = btn.dataset.savenote;
        const slider = arrivalBox.querySelector(`[data-scoreevent="${key}"]`);
        const noteInput = arrivalBox.querySelector(`[data-noteevent="${key}"]`);
        setEventScore(name, key, Number(slider.value));
        setEventNote(name, key, noteInput.value);
        showToast("💾 分數與心得已儲存！");
      });
    });
  }
}

function renderMemberDash(name, content){
  const g = groupOf[name];
  const col = GROUP_COLORS[g];

  content.innerHTML = selfSectionHtml(name, "my") + `
    <div class="card panel">
      <div class="panel-title" style="color:${col.text};">🏘️ 我的大天使小組</div>
      <div class="panel-sub">${groupDisplayName(g)} 組的所有成員</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        ${groups[g].map(n=>`<span style="background:${col.bg};color:${col.text};padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:${n===name?"800":"600"};">${n===name?"👉 ":""}${label(n)}</span>`).join("")}
      </div>
    </div>
  `;
  wireSelfSectionEvents(name, "my");
}

// 記住上次登入的名字，方便下次自動帶入（密碼仍需輸入）
const suggestBox = document.getElementById("nameSuggestBox");
function renderSuggestions(filter){
  const f = (filter||"").trim();
  let html = "";
  Object.keys(groups).forEach(g=>{
    const matches = groups[g].filter(n=> !f || n.includes(f) || (akaOf[n]&&akaOf[n].includes(f)));
    if(!matches.length) return;
    html += `<div class="suggest-group-label">${groupDisplayName(g)}</div>`;
    matches.forEach(n=>{
      html += `<div class="suggest-item" data-name="${n}">${label(n)}</div>`;
    });
  });
  suggestBox.innerHTML = html;
  suggestBox.querySelectorAll(".suggest-item").forEach(el=>{
    el.addEventListener("mousedown", e=>{
      e.preventDefault();
      nameInput.value = el.dataset.name;
      localStorage.setItem("lastLoginName", el.dataset.name);
      suggestBox.classList.remove("show");
      pwInput.focus();
    });
  });
}
nameInput.addEventListener("focus", ()=>{ renderSuggestions(nameInput.value); suggestBox.classList.add("show"); });
nameInput.addEventListener("input", ()=>{ renderSuggestions(nameInput.value); suggestBox.classList.add("show"); });
document.addEventListener("click", e=>{
  if(!suggestBox.contains(e.target) && e.target!==nameInput) suggestBox.classList.remove("show");
});

const connStatusEl = document.getElementById("connStatus");
if(fbEnabled){
  connStatusEl.textContent = "🟢 已連上雲端（大家共用同一份資料）";
  connStatusEl.style.color = "var(--sage-deep)";
} else {
  connStatusEl.textContent = "🔴 尚未連上雲端（目前是本機模式，只有這台裝置看得到）";
  connStatusEl.style.color = "#C0435C";
}

const savedName = localStorage.getItem("lastLoginName");
if(savedName) nameInput.value = savedName;
nameInput.addEventListener("change", ()=> localStorage.setItem("lastLoginName", nameInput.value.trim()));
</script>
